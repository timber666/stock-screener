# 觀察清單（唯一來源）。market: tse = 上市, otc = 上櫃
# 格式：code 必須加引號；industry 寫「族群/子分類」，族群未列子分類時只寫族群；themes 可多個，也可省略
# 分類：industry 為公司「做什麼」，依主要營收決定（同類產品合併計算）；市場「炒什麼」另以 themes 標註
# 市場別依證交所 ISIN 代號清單查證；成交量為 2026-10-30 證交所、櫃買中心收盤資料
# 選股來源與篩選（2026-10-30～31，個別加回或移除見 git 紀錄）：
#   PCB 概念股清單：移除 PCB 相關營收比重過低、成交量 < 1000 張（處置股除外）者
#   記憶體、被動元件、光通訊（不含下游段）、IC 設計清單：只含上市櫃，移除成交量 < 500 張、
#   營收與該產業無關，以及與前面清單重複者
#   AI 伺服器概念股清單（另補清單遺漏的電源、電池、散熱、機殼、連接器廠）：同上，
#   並先排除半導體設備、檢測、封測、材料類股（另開產業）
#   半導體製造、光學、網通：重新分類時由上述清單移入

industries:                  # 族群 → 子分類；順序決定顯示順序（產業鏈依上游到下游）
  PCB: [材料, 玻璃纖維、玻纖布, 設備、耗材, 銅箔基板, PCB製造]
  記憶體: [記憶體IC, 封測, 模組、儲存, 通路]
  被動元件: [電感器材料, 電容器材料, 電阻器材料, 電阻器, 電容器, 電感器, 濾波器、振盪器]
  光通訊: [磊晶、晶圓代工, 光元件、光收發模組]
  IC設計: [矽智財, ASIC設計, 網路通訊IC, 磁碟儲存控制器IC, 輸出入介面IC, 顯示器驅動IC, 影像感測IC, 微控制器IC, 電源管理IC, 功率元件, 消費性IC, 其他]
  半導體製造: [設備, 晶圓代工, 封測]
  光學: [光學材料, 光學鏡頭]
  網通: [交換器, 寬頻設備, 系統整合、電信服務]
  電腦及週邊: [系統代工, 品牌, 系統整合、通路]
  散熱: [散熱模組, 風扇, 熱交換器]
  機構件: [機殼, 轉軸]
  電源: [電源供應器, 電池]
  連接器: [連接器, 線材]

themes: [AI伺服器, 矽光子, CPO]

