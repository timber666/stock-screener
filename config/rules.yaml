trend:
  pivot_ma: 5
  lookback_days: 120
  bull_break_to_range: true    # 多頭跌破前底 → 盤整
  bear_break_to_range: true    # 空頭突破前頭 → 盤整

# 每條規則屬於多方或空方（由規則本身決定）；前置條件只管同方向的觸發規則
filters:
  - id: above_ma20             # 多方：現價 > MA20
    enabled: true
    params: { ma: 20 }
  - id: below_ma20             # 空方：現價 < MA20
    enabled: true
    params: { ma: 20 }

trigger_rules:                 # trends: bull | range | bear；空陣列 = 不限（含資料不足）
  # 多方
  - id: bull_ma5_breakout
    enabled: true
    params: { trends: [bull], ma: 5 }
  - id: range_breakout_volume
    enabled: true
    params: { trends: [range], min_body_pct: 3.0, volume_ratio: 1.3, high_lookback_days: 40 }
  - id: ma_bull_alignment
    enabled: true
    params: { trends: [], mas: [5, 10, 20], only_on_formation: true }
  # 空方
  - id: bear_ma5_breakdown
    enabled: true
    params: { trends: [bear], ma: 5 }
  - id: range_breakdown        # 與 range_breakout_volume 對稱，但不看成交量
    enabled: true
    params: { trends: [range], min_body_pct: 3.0, low_lookback_days: 40 }
  - id: ma_bear_alignment
    enabled: true
    params: { trends: [], mas: [5, 10, 20], only_on_formation: true }

exit_rules: []                 # 保留，尚未實作
