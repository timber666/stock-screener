# 研究功能的設定（RESEARCH_PLAN.md 第 5 節）。只有研究指令會讀取，
# 寫錯時不影響每日的 update、scan（PROJECT_PLAN.md 10.4）。FinMind、Discord 的請求設定沿用 settings.yaml。
events:                         # events 指令（除權息、減資、面額變更，PROJECT_PLAN.md 14.2）
  refetch_days: 7               # 已查過的股票，從上次查詢的迄日往前重疊幾天再查，補上較晚公告的資料
  reference_tolerance_pct: 0.5  # 交叉驗證：以股利金額計算的參考價與官方差異超過此值（%）時列在 log
  dividend_lookahead_days: 30   # 股利資料以權利分派基準日篩選（比除權息交易日晚 6～10 天），查詢迄日往後放寬的天數
isin:                           # 證交所 ISIN 清單（上市日／上櫃日），events 指令使用；欄位同 settings.yaml 的 finmind
  timeout_sec: 60               # 上市清單約 10 MB
  retry: 3
  retry_backoff_sec: 5
  request_interval_sec: 1
signal_report:                  # 訊號成績單：python -m screener signal-report（RESEARCH_PLAN.md 4.1）
  horizons: [1, 5]              # 「累積」一段的持有交易日數
  top_n: 3                      # 本週表現最好、最差各列出幾個
  output_dir: data/research/signal_report     # 明細 CSV（不進版控）
  backtest_summary: data/backtest/summary.csv # M6 回測的統計，用來對照「M6 驗證段」；不存在時不顯示
market:                         # 全市場資料（RESEARCH_PLAN.md 4.3）：market-update、market-check、--universe market
  db_path: data/market.db       # 全市場日 K 與事件；每日系統不讀取（PROJECT_PLAN.md 10.4）
  raw_dir: data/research/market_raw   # 證交所、櫃買中心的原始回應（壓縮檔），解析有誤時不必重新抓取
  start: 2015-01-01             # 回補的起點（R8）
  signal_start: 2015-07-01      # --universe market 的訊號起點：轉折點要 120 根計算區間，回補後約半年才完整
  compare_start: 2021-01-01     # 與觀察清單並列的起點（觀察清單的日 K 從 2020-06 起）
  universe:                     # 股票池（R7）：每月第一個交易日依平均成交金額排名
    size: 500                   # 取前幾名
    lookback_days: 60           # 平均成交金額的交易日數（不含當天；沒有成交的日子算 0）
  output_dir: data/backtest/market        # backtest、trade-backtest --universe market 的輸出
  check_dir: data/research/market_check   # market-check 的明細 CSV
  exchange:                     # 證交所、櫃買中心的請求，兩邊各自計算間隔；頻率限制沒有公開
    timeout_sec: 30
    retry: 3
    retry_backoff_sec: 30       # 第 n 次重試前等待 n × 此秒數
    request_interval_sec: 5
  mops:                         # 公開資訊觀測站（月營收與產業別，RESEARCH_PLAN.md 4.4）；頻率限制沒有公開
    timeout_sec: 30
    retry: 3
    retry_backoff_sec: 30
    request_interval_sec: 5
  revenue_available_day: 10     # M 月的營收在 M+1 月這一天之後的第一個交易日才能用（法定期限，R26）
  revenue_settle_days: 5        # 上一個日子再過幾天視為公布完成；之前抓到的下次再抓
factors:                        # 單因子研究：python -m screener factor-report（RESEARCH_PLAN.md 4.4、4.5）
  output_dir: data/research/factors   # summary.csv、ic.csv、groups.csv、report.html（不進版控）
  horizons: [1, 5, 20]          # 持有交易日數：完整列出 IC、分位數、換手（R17）
  decay_horizons: [1, 2, 3, 5, 10, 20]  # 只列 IC 的衰減（R17）
  summary_horizon: 5            # 終端摘要與單一天數圖表使用的持有天數
  quantiles: 5                  # 每天分成幾組（R19）
  min_stocks: 100               # 當天有因子值的股票少於此數時不計算
  min_industry_stocks: 5        # 當天同產業的股票少於此數時併到「其他」再中性化
  definitions:                  # kind 為程式註冊的計算方式（research/factors/），params 為它的參數
    # 動能
    - { id: mom_12_1, kind: momentum, params: { lookback: 250, skip: 20 } }
    - { id: mom_6_1, kind: momentum, params: { lookback: 120, skip: 20 } }
    # 短期反轉
    - { id: ret_5, kind: past_return, params: { days: 5 } }
    - { id: ret_20, kind: past_return, params: { days: 20 } }
    # 波動
    - { id: vol_60, kind: volatility, params: { days: 60 } }
    - { id: max_20, kind: max_daily_return, params: { days: 20 } }
    # 流動性
    - { id: adv_60, kind: average_value, params: { days: 60 } }
    - { id: value_surge, kind: value_surge, params: { short: 5, long: 60 } }
    # 現有規則改成分數
    - { id: ma20_gap, kind: ma_gap, params: { ma: 20 } }
    - { id: ma5_gap, kind: ma_gap, params: { ma: 5 } }
    - { id: vol_ratio, kind: volume_ratio, params: {} }
    - { id: body, kind: candle_body, params: {} }
    - { id: high_gap_40, kind: high_gap, params: { days: 40 } }
    - { id: low_gap_40, kind: low_gap, params: { days: 40 } }
    - { id: ma_spread, kind: ma_spread, params: { short: 5, long: 20 } }
    - { id: trend, kind: trend, params: {} }
    # 基本面（M9b）
    - { id: rev_yoy, kind: revenue_yoy, params: {} }
    - { id: rev_mom, kind: revenue_mom, params: {} }
    - { id: rev_cum_yoy, kind: revenue_cum_yoy, params: {} }
    - { id: rev_accel, kind: revenue_acceleration, params: { months: 3 } }
    - { id: ep, kind: earnings_yield, params: {} }
    - { id: profitable, kind: profitable, params: {} }
    - { id: bp, kind: book_yield, params: {} }
    - { id: dy, kind: dividend_yield, params: {} }
    - { id: size, kind: size, params: {} }
    - { id: turnover_60, kind: share_turnover, params: { days: 60 } }
portfolio:                      # 組合回測與模擬組合：portfolio-backtest、portfolio-track（RESEARCH_PLAN.md 4.6）
  initial_capital: 300000       # 初始資金（元）；觀察段、驗證段與模擬組合各自從這個金額開始
  factors: [rev_yoy, rev_accel, bp, dy]   # 候選因子（R30），只依觀察段選出
  top_n: [10, 20]               # 持股檔數，各跑一次（R32）
  picks: [top_factor, top_value]    # 挑法：因子值最高、最高組內平均成交金額最大
  liquidity_factor: adv_60      # top_value 排序用的因子
  random_runs: 100              # 最高組隨機 N 檔跑幾次，列出中位數與 5%～95% 範圍（R35）
  random_seed: 42               # 固定種子，重跑結果相同
  output_dir: data/research/portfolio   # observe/、validate/ 底下各有 summary.csv、trades.csv、equity.csv、report.html
  paper_db_path: data/research/paper_portfolio.db   # 模擬組合的狀態；每日系統不讀取（PROJECT_PLAN.md 10.4）
  track: { factor: dy, top_n: 10, pick: top_value }   # 模擬組合追蹤的一組，必須是回測比較過的組合（R36、R38）
